# Statische Seite ohne Build-Schritt
[build]
  publish = "."

# Service Worker nie zwischenspeichern, damit Updates sofort ankommen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Alte Adressen dauerhaft auf die Hauptdomain umleiten
[[redirects]]
  from = "https://thermikdoku.wust.io/*"
  to = "https://thermikdoku.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://thermikdoku.wust.io/*"
  to = "https://thermikdoku.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://thermikdoku.netlify.app/*"
  to = "https://thermikdoku.de/:splat"
  status = 301
  force = true
